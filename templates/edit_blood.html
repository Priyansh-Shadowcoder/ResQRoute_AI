
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blood Inventory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px 20px;
        }

        .edit-container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #243447;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
            color: #344054;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .cancel-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #333;
        }
    </style>
</head>

<body>

<div class="edit-container">

    <h2>Edit Blood Inventory</h2>

    <form method="POST">

        <label>Blood Group</label>

        <select name="blood_group" required>
            {% for group in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                <option value="{{ group }}"
                    {% if blood.blood_group == group %}selected{% endif %}>
                    {{ group }}
                </option>
            {% endfor %}
        </select>

        <label>Available Units</label>

        <input
            type="number"
            name="available_units"
            min="0"
            value="{{ blood.available_units }}"
            required
        >

        <label>Required Units</label>

        <input
            type="number"
            name="required_units"
            min="0"
            value="{{ blood.required_units }}"
            required
        >

        <div class="buttons">
            <button type="submit">Save Changes</button>

            <a href="{{ url_for('hospital_interface') }}#blood-bank"
               class="cancel-btn">
                Cancel
            </a>
        </div>

    </form>

</div>

</body>
</html>
