<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Equipment | ResQRoute AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #edf3fc;
            color: #172554;
            padding: 40px 20px;
        }

        .edit-container {
            max-width: 600px;
            margin: 30px auto;
            background: linear-gradient(145deg, #ffffff, #f8fbff);
            border: 1px solid #e1ebfa;
            border-top: 5px solid #14b8a6;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 8px 25px rgba(30, 70, 120, 0.10);
        }

        h2 {
            color: #123b70;
            margin-bottom: 10px;
            font-size: 25px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            color: #173b68;
            outline: none;
            margin-bottom: 20px;
            transition: 0.3s ease;
        }

        input:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.12);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button,
        .cancel-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s ease;
        }

        button {
            background: linear-gradient(100deg, #0f766e, #14b8a6);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(20, 184, 166, 0.25);
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #334155;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        @media (max-width: 500px) {
            .edit-container {
                padding: 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>

</head>

<body>

    <div class="edit-container">

        <h2>⚕ Edit Equipment</h2>

        <p class="subtitle">
            Update emergency equipment and availability details.
        </p>

        <form method="POST">

            <label>Equipment Name</label>

            <input
                type="text"
                name="equipment_name"
                value="{{ equipment.equipment_name }}"
                required
            >

            <label>Total Quantity</label>

            <input
                type="number"
                name="total_quantity"
                min="0"
                value="{{ equipment.total_quantity }}"
                required
            >

            <label>Available Quantity</label>

            <input
                type="number"
                name="available_quantity"
                min="0"
                value="{{ equipment.available_quantity }}"
                required
            >

            <div class="buttons">

                <button type="submit">
                    Save Changes
                </button>

                <a
                    href="{{ url_for('hospital_interface') }}#equipment"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>
</html>
